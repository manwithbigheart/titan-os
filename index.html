<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN NEXUS | The Flow State</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tilt.js/1.2.1/tilt.jquery.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] },
                    colors: {
                        neon: { blue: '#00f3ff', purple: '#bc13fe', pink: '#ff0055' },
                        void: '#050505',
                        glass: 'rgba(255, 255, 255, 0.03)'
                    },
                    backgroundImage: {
                        'aurora': 'linear-gradient(125deg, #000000 0%, #1a0b2e 50%, #000000 100%)',
                        'glass-gradient': 'linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%)'
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #050505; color: #fff; overflow-x: hidden; cursor: none; } /* Hide default cursor */
        
        /* CUSTOM CURSOR */
        #cursor-dot, #cursor-outline { position: fixed; top: 0; left: 0; transform: translate(-50%, -50%); border-radius: 50%; z-index: 9999; pointer-events: none; }
        #cursor-dot { width: 8px; height: 8px; background: #00f3ff; }
        #cursor-outline { width: 40px; height: 40px; border: 1px solid rgba(0, 243, 255, 0.5); transition: width 0.2s, height 0.2s; }
        
        /* GLASSMORPHISM 2.0 */
        .nexus-card {
            background: rgba(20, 20, 20, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nexus-card:hover {
            border-color: rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.1);
        }

        /* TEXT GLOW */
        .glow-text { text-shadow: 0 0 20px rgba(0, 243, 255, 0.6); }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }

        /* MESH GRADIENT ANIMATION */
        .mesh-bg {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a0b2e 0%, #000000 100%);
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
            animation: float 10s infinite ease-in-out;
        }
        @keyframes float { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(30px, -50px); } }

        /* NAV LINK HOVER */
        .nav-link { position: relative; }
        .nav-link::after {
            content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0;
            background: #00f3ff; transition: width 0.3s;
        }
        .nav-link:hover::after { width: 100%; }
        
        /* 3D MAP NODES */
        .node { transition: all 0.3s; }
        .node:hover { transform: scale(1.2); filter: drop-shadow(0 0 10px #00f3ff); }
        .connector { stroke-dasharray: 100; stroke-dashoffset: 100; animation: dash 2s forwards; }
        @keyframes dash { to { stroke-dashoffset: 0; } }
    </style>
</head>
<body class="font-sans antialiased selection:bg-neon-blue selection:text-black">

    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <div class="mesh-bg">
        <div class="orb w-96 h-96 bg-neon-purple/30 top-0 left-0"></div>
        <div class="orb w-[500px] h-[500px] bg-blue-900/20 bottom-0 right-0 animation-delay-2000"></div>
    </div>

    <div class="flex h-screen overflow-hidden relative">

        <aside class="w-20 lg:w-24 h-screen border-r border-white/5 flex flex-col items-center py-8 z-50 glass" style="background: rgba(0,0,0,0.6);">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-neon-blue to-neon-purple flex items-center justify-center mb-12 shadow-[0_0_20px_rgba(0,243,255,0.4)] cursor-pointer hover:rotate-12 transition-transform duration-500">
                <i class="fa-solid fa-cube text-white text-xl"></i>
            </div>

            <nav class="flex-1 space-y-8 flex flex-col items-center w-full">
                <button onclick="app.nav.switch('dashboard')" class="nav-btn group relative w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 transition-all text-slate-400 hover:text-white active">
                    <i class="fa-solid fa-layer-group text-xl transition-transform group-hover:scale-110"></i>
                    <span class="absolute left-14 bg-white text-black text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Dashboard</span>
                </button>
                <button onclick="app.nav.switch('constellation')" class="nav-btn group relative w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 transition-all text-slate-400 hover:text-white">
                    <i class="fa-solid fa-network-wired text-xl transition-transform group-hover:scale-110"></i>
                    <span class="absolute left-14 bg-white text-black text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Constellation</span>
                </button>
                <button onclick="app.nav.switch('arena')" class="nav-btn group relative w-12 h-12 flex items-center justify-center rounded-2xl hover:bg-white/10 transition-all text-slate-400 hover:text-white">
                    <i class="fa-solid fa-gamepad text-xl transition-transform group-hover:scale-110"></i>
                    <span class="absolute left-14 bg-white text-black text-xs font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">The Arena</span>
                </button>
            </nav>

            <button onclick="app.ui.toggleZen()" class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center text-slate-500 hover:text-neon-pink hover:border-neon-pink transition-colors">
                <i class="fa-solid fa-power-off"></i>
            </button>
        </aside>

        <main class="flex-1 relative overflow-y-auto overflow-x-hidden scroll-smooth" id="main-scroll">
            
            <header class="h-24 flex items-center justify-between px-8 lg:px-12 sticky top-0 z-40 backdrop-blur-md">
                <div>
                    <h2 class="font-display text-3xl font-bold text-white tracking-tight">Welcome, <span class="text-transparent bg-clip-text bg-gradient-to-r from-neon-blue to-neon-purple animate-pulse">Titan</span></h2>
                    <p class="text-sm text-slate-400">System Status: <span class="text-green-400">OPTIMAL</span></p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden md:flex items-center gap-2 bg-white/5 px-4 py-2 rounded-full border border-white/10">
                        <div class="w-2 h-2 bg-red-500 rounded-full animate-ping"></div>
                        <span class="text-xs font-mono text-slate-300">LIVE FEED: <span id="live-user">Alex finished 'Java OOP'</span></span>
                    </div>
                    <button onclick="app.pomo.toggle()" class="w-12 h-12 rounded-full bg-gradient-to-r from-neon-purple to-neon-pink flex items-center justify-center shadow-[0_0_20px_rgba(188,19,254,0.5)] hover:scale-110 transition-transform">
                        <i class="fa-solid fa-bolt text-white text-xl"></i>
                    </button>
                </div>
            </header>

            <div id="view-dashboard" class="p-8 lg:p-12 space-y-12 view-section">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="nexus-card p-8 rounded-3xl relative overflow-hidden group" data-tilt data-tilt-max="10" data-tilt-glare data-tilt-max-glare="0.5">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-neon-blue/20 rounded-full blur-3xl group-hover:bg-neon-blue/40 transition-colors"></div>
                        <p class="font-display text-sm text-slate-400 uppercase tracking-widest mb-2">Total XP</p>
                        <h3 class="font-display text-5xl font-bold text-white mb-2 counter" data-target="12450">0</h3>
                        <div class="w-full bg-white/10 h-1 mt-4 rounded-full overflow-hidden">
                            <div class="h-full bg-neon-blue w-[70%] shadow-[0_0_10px_#00f3ff]"></div>
                        </div>
                    </div>

                    <div class="nexus-card p-8 rounded-3xl relative overflow-hidden group" data-tilt data-tilt-max="10">
                        <div class="absolute -right-10 -top-10 w-40 h-40 bg-neon-purple/20 rounded-full blur-3xl group-hover:bg-neon-purple/40 transition-colors"></div>
                        <p class="font-display text-sm text-slate-400 uppercase tracking-widest mb-2">Current Streak</p>
                        <h3 class="font-display text-5xl font-bold text-white mb-2 counter" data-target="14">0</h3>
                        <p class="text-xs text-neon-purple font-mono">DAYS OF GLORY</p>
                    </div>

                    <div class="nexus-card p-8 rounded-3xl relative overflow-hidden group border-neon-pink/30" data-tilt data-tilt-max="10">
                        <div class="absolute inset-0 bg-gradient-to-br from-neon-pink/10 to-transparent"></div>
                        <div class="flex justify-between items-center h-full relative z-10">
                            <div>
                                <p class="font-display text-sm text-slate-400 uppercase tracking-widest mb-2">Focus Mode</p>
                                <button onclick="app.pomo.toggle()" class="mt-2 px-6 py-3 bg-neon-pink hover:bg-pink-600 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(255,0,85,0.4)] transition-all">ENGAGE</button>
                            </div>
                            <i class="fa-solid fa-headset text-6xl text-white/10"></i>
                        </div>
                    </div>
                </div>

                <div>
                    <h3 class="font-display text-2xl font-bold text-white mb-6 flex items-center gap-3">
                        <span class="w-1 h-8 bg-neon-blue rounded-full"></span> Mission Status
                    </h3>
                    <div class="space-y-4" id="syllabus-list">
                        </div>
                </div>
            </div>

            <div id="view-constellation" class="view-section hidden h-[calc(100vh-100px)] relative overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center">
                    <svg width="800" height="600" viewBox="0 0 800 600" id="network-svg" class="w-full h-full opacity-0 scale-90 transition-all duration-1000">
                        <path d="M400,300 L200,150" stroke="rgba(255,255,255,0.1)" stroke-width="2" class="connector"></path>
                        <path d="M400,300 L600,150" stroke="rgba(255,255,255,0.1)" stroke-width="2" class="connector"></path>
                        <path d="M400,300 L200,450" stroke="rgba(255,255,255,0.1)" stroke-width="2" class="connector"></path>
                        <path d="M400,300 L600,450" stroke="rgba(255,255,255,0.1)" stroke-width="2" class="connector"></path>
                        
                        <g class="node cursor-pointer group" onclick="app.ui.openNode('Core Java')">
                            <circle cx="400" cy="300" r="40" fill="#0b0f19" stroke="#00f3ff" stroke-width="2" class="group-hover:fill-neon-blue/20 transition-all"></circle>
                            <text x="400" y="305" text-anchor="middle" fill="white" font-family="Space Grotesk" font-size="12" font-weight="bold">CORE</text>
                        </g>
                        
                        <g class="node cursor-pointer group" onclick="app.ui.openNode('Algorithms')">
                            <circle cx="200" cy="150" r="30" fill="#0b0f19" stroke="#bc13fe" stroke-width="2" class="group-hover:fill-neon-purple/20 transition-all"></circle>
                            <text x="200" y="155" text-anchor="middle" fill="white" font-family="Space Grotesk" font-size="10">DSA</text>
                        </g>

                        <g class="node cursor-pointer group" onclick="app.ui.openNode('Web Dev')">
                            <circle cx="600" cy="150" r="30" fill="#0b0f19" stroke="#ff0055" stroke-width="2" class="group-hover:fill-neon-pink/20 transition-all"></circle>
                            <text x="600" y="155" text-anchor="middle" fill="white" font-family="Space Grotesk" font-size="10">WEB</text>
                        </g>
                        
                        </svg>
                </div>
            </div>

        </main>
    </div>

    <div id="focus-overlay" class="fixed inset-0 z-[100] bg-black/90 backdrop-blur-3xl flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-500">
        <div class="absolute top-10 right-10">
            <button onclick="app.pomo.toggle()" class="text-white/50 hover:text-white transition text-xl"><i class="fa-solid fa-times"></i></button>
        </div>
        
        <div class="relative w-96 h-96 flex items-center justify-center">
            <div class="absolute w-full h-full border border-neon-blue/20 rounded-full animate-ping" style="animation-duration: 3s;"></div>
            <div class="absolute w-[80%] h-[80%] border border-neon-purple/20 rounded-full animate-ping" style="animation-duration: 3s; animation-delay: 1s;"></div>
            
            <h1 id="timer" class="font-display text-8xl font-bold text-white glow-text tabular-nums">25:00</h1>
        </div>
        
        <div class="mt-12 flex gap-8">
            <button class="px-8 py-3 rounded-full border border-white/20 text-white hover:bg-white hover:text-black transition font-bold tracking-widest" onclick="app.pomo.start()">START</button>
            <button class="px-8 py-3 rounded-full border border-white/20 text-white hover:bg-white hover:text-black transition font-bold tracking-widest" onclick="app.pomo.reset()">RESET</button>
        </div>
        
        <p class="mt-8 text-slate-500 font-mono text-xs uppercase tracking-[0.3em]">Zone Interaction Protocol</p>
    </div>

    <div id="node-modal" class="fixed inset-0 z-[90] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center">
        <div class="nexus-card w-full max-w-lg p-8 rounded-3xl transform scale-90 opacity-0 transition-all duration-300" id="node-card">
            <h2 id="modal-title" class="text-3xl font-display font-bold text-white mb-4">Topic Title</h2>
            <p class="text-slate-400 mb-6">Mastery of this node is required for system advancement.</p>
            <div class="space-y-3 mb-8">
                <div class="flex items-center gap-4 p-4 bg-white/5 rounded-xl border border-white/5 hover:border-neon-blue/50 transition cursor-pointer">
                    <div class="w-8 h-8 rounded-full bg-neon-blue/20 flex items-center justify-center text-neon-blue"><i class="fa-solid fa-book"></i></div>
                    <span class="text-sm font-bold">Read Documentation</span>
                </div>
                <div class="flex items-center gap-4 p-4 bg-white/5 rounded-xl border border-white/5 hover:border-neon-purple/50 transition cursor-pointer">
                    <div class="w-8 h-8 rounded-full bg-neon-purple/20 flex items-center justify-center text-neon-purple"><i class="fa-solid fa-code"></i></div>
                    <span class="text-sm font-bold">Practice Problem</span>
                </div>
            </div>
            <button onclick="app.ui.closeNode()" class="w-full py-3 bg-white text-black font-bold rounded-xl hover:scale-[1.02] transition">CLOSE LINK</button>
        </div>
    </div>

    <script>
        // --- SOUND ENGINE ---
        const sfx = {
            hover: new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'], volume: 0.1 }),
            click: new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'], volume: 0.3 }),
            success: new Howl({ src: ['https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3'], volume: 0.5 })
        };

        // --- APP LOGIC ---
        const app = {
            data: {
                syllabus: [
                    { title: "Algorithms & Logic", progress: 75, color: "bg-neon-blue" },
                    { title: "System Architecture", progress: 40, color: "bg-neon-purple" },
                    { title: "Database Sharding", progress: 10, color: "bg-neon-pink" },
                    { title: "React Physics", progress: 90, color: "bg-green-400" }
                ],
                timer: null,
                timeLeft: 1500
            },
            
            init: () => {
                app.ui.renderSyllabus();
                app.ui.initCursor();
                app.ui.animateIntro();
                
                // Add Sound Listeners
                document.querySelectorAll('button, .nexus-card, .node').forEach(el => {
                    el.addEventListener('mouseenter', () => sfx.hover.play());
                    el.addEventListener('click', () => sfx.click.play());
                });

                // Live Feed Simulator
                setInterval(() => {
                    const names = ["Sarah", "Davide", "Jin", "Aara"];
                    const tasks = ["fixed a bug", "deployed app", "finished SQL", "earned 'Titan' badge"];
                    const name = names[Math.floor(Math.random() * names.length)];
                    const task = tasks[Math.floor(Math.random() * tasks.length)];
                    const el = document.getElementById('live-user');
                    el.style.opacity = 0;
                    setTimeout(() => {
                        el.innerText = `${name} ${task}`;
                        el.style.opacity = 1;
                    }, 500);
                }, 5000);
            },

            ui: {
                initCursor: () => {
                    const dot = document.getElementById('cursor-dot');
                    const outline = document.getElementById('cursor-outline');
                    
                    window.addEventListener('mousemove', (e) => {
                        const posX = e.clientX;
                        const posY = e.clientY;
                        
                        // Dot follows instantly
                        dot.style.left = `${posX}px`;
                        dot.style.top = `${posY}px`;
                        
                        // Outline follows with delay (GSAP)
                        gsap.to(outline, { x: posX, y: posY, duration: 0.15, ease: "power2.out" });
                    });
                    
                    // Hover effects
                    document.querySelectorAll('a, button, .cursor-pointer').forEach(el => {
                        el.addEventListener('mouseenter', () => {
                            gsap.to(outline, { scale: 1.5, borderColor: '#fff', duration: 0.2 });
                        });
                        el.addEventListener('mouseleave', () => {
                            gsap.to(outline, { scale: 1, borderColor: 'rgba(0, 243, 255, 0.5)', duration: 0.2 });
                        });
                    });
                },

                animateIntro: () => {
                    gsap.from(".nexus-card", {
                        y: 50, opacity: 0, duration: 1, stagger: 0.2, ease: "power3.out"
                    });
                    gsap.from(".counter", {
                        textContent: 0, duration: 2, ease: "power1.out", snap: { textContent: 1 },
                        stagger: 0.2
                    });
                },

                renderSyllabus: () => {
                    const container = document.getElementById('syllabus-list');
                    app.data.syllabus.forEach(item => {
                        container.innerHTML += `
                        <div class="group flex items-center gap-4 p-4 rounded-xl hover:bg-white/5 transition border border-transparent hover:border-white/5 cursor-pointer">
                            <div class="w-10 h-10 rounded-lg ${item.color}/20 flex items-center justify-center text-white font-bold">${item.progress}%</div>
                            <div class="flex-1">
                                <h4 class="font-bold text-slate-200 group-hover:text-white transition">${item.title}</h4>
                                <div class="w-full h-1 bg-white/10 rounded-full mt-2 overflow-hidden">
                                    <div class="h-full ${item.color} w-0 group-hover:w-[${item.progress}%] transition-all duration-1000" style="width: ${item.progress}%"></div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-600 group-hover:text-white transition-transform group-hover:translate-x-1"></i>
                        </div>`;
                    });
                },

                openNode: (title) => {
                    const modal = document.getElementById('node-modal');
                    const card = document.getElementById('node-card');
                    document.getElementById('modal-title').innerText = title;
                    
                    modal.classList.remove('hidden');
                    // Animate In
                    gsap.to(card, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" });
                },

                closeNode: () => {
                    const modal = document.getElementById('node-modal');
                    const card = document.getElementById('node-card');
                    gsap.to(card, { scale: 0.9, opacity: 0, duration: 0.3, onComplete: () => modal.classList.add('hidden') });
                },

                toggleZen: () => {
                    const sidebar = document.querySelector('aside');
                    const header = document.querySelector('header');
                    
                    if (sidebar.style.display === 'none') {
                        sidebar.style.display = 'flex';
                        header.style.display = 'flex';
                    } else {
                        sidebar.style.display = 'none';
                        header.style.display = 'none';
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    }
                }
            },

            nav: {
                switch: (view) => {
                    // Fade out current
                    gsap.to(".view-section", { opacity: 0, duration: 0.3, onComplete: () => {
                        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
                        const target = document.getElementById(`view-${view}`);
                        target.classList.remove('hidden');
                        target.style.opacity = 0;
                        
                        // Special Animation for Constellation
                        if(view === 'constellation') {
                            const svg = document.getElementById('network-svg');
                            svg.classList.remove('scale-90', 'opacity-0');
                        }
                        
                        // Fade in new
                        gsap.to(target, { opacity: 1, duration: 0.5 });
                    }});
                    
                    // Update Active Nav State
                    // (Simplified for demo)
                }
            },

            pomo: {
                toggle: () => {
                    const overlay = document.getElementById('focus-overlay');
                    if (overlay.classList.contains('hidden')) {
                        overlay.classList.remove('hidden');
                        gsap.to(overlay, { opacity: 1, duration: 0.5 });
                    } else {
                        gsap.to(overlay, { opacity: 0, duration: 0.5, onComplete: () => overlay.classList.add('hidden') });
                    }
                },
                start: () => {
                    // Simple Timer Logic
                    if(app.data.timer) return;
                    app.data.timer = setInterval(() => {
                        app.data.timeLeft--;
                        const m = Math.floor(app.data.timeLeft / 60);
                        const s = app.data.timeLeft % 60;
                        document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                        if(app.data.timeLeft <= 0) {
                            clearInterval(app.data.timer);
                            sfx.success.play();
                            alert("FOCUS COMPLETE. SYSTEM UPGRADED.");
                        }
                    }, 1000);
                },
                reset: () => {
                    clearInterval(app.data.timer);
                    app.data.timer = null;
                    app.data.timeLeft = 1500;
                    document.getElementById('timer').innerText = "25:00";
                }
            }
        };

        // Boot System
        window.addEventListener('load', app.init);
    </script>
</body>
</html>
